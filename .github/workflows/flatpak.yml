name: Flatpak Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    name: "Flatpak Build & Bundle"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Credentials for Private Repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --no-net flatpak/io.github.inaa.metainfo.xml || true

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: inaa.flatpak
          manifest-path: flatpak/io.github.inaa.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inaa-flatpak
          path: inaa.flatpak

      - name: Release Flatpak to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: inaa.flatpak
          generate_release_notes: true
